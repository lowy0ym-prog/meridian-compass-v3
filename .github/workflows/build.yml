name: Build Meridian Compass Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and unzip project (if it was uploaded as a .zip)
        run: |
          if [ -f "MeridianCompass.zip" ]; then
            echo "Found MeridianCompass.zip — extracting."
            unzip -q MeridianCompass.zip -d extracted
            echo "PROJECT_DIR=extracted/MeridianCompass" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "MeridianCompass/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=MeridianCompass" >> "$GITHUB_ENV"
          else
            echo "Could not find the project." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeridianCompass-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
